# HTTP: redirect everything to HTTPS
<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# HTTPS: Angular app in / and PHP API in /api
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/midori-kissa.crt
    SSLCertificateKeyFile /etc/ssl/private/midori-kissa.key

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /api /var/www/backend/public
    <Directory /var/www/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Product photos uploaded from the admin panel (a Docker volume).
    # Only images are served: PHP files in this folder are never run or sent
    Alias /uploads /var/www/uploads
    <Directory /var/www/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
